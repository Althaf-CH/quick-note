<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Note</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div>
            <h1>Quick Note</h1>
            <p>Capture your thoughts, ideas and reminders.</p>
        </div>
    </header>

    <main class="container">

        <section class="note-form-card">
            <h2>Create a Note</h2>

            <form id="noteForm">
                <input
                    type="text"
                    id="title"
                    placeholder="Note title"
                    required
                >

                <textarea
                    id="content"
                    placeholder="Write your note here..."
                    required
                ></textarea>

                <button type="submit">Add Note</button>
            </form>
        </section>

        <section class="notes-section">
            <div class="section-header">
                <h2>Your Notes</h2>
                <span id="noteCount">0 notes</span>
            </div>

            <div id="notesContainer" class="notes-container">
                <p class="empty-message">No notes yet. Create your first note!</p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
